# Blueprint de Render: la API en el plan gratuito. La base es Postgres en Neon (DATABASE_URL).
# En Render: New → Blueprint → este repo. Guía completa en docs/deploy.md.
services:
  - type: web
    name: gym-tracker-api
    runtime: node
    plan: free
    # Misma región que la base en Neon (AWS us-east-1): cada consulta cruza la red una sola vez.
    region: virginia
    branch: main
    # El plan gratuito no tiene pre-deploy: las migraciones y el catálogo se aplican al compilar.
    buildCommand: >-
      npm install -g pnpm@10.14.0 &&
      pnpm install --frozen-lockfile --filter @gym/api... &&
      pnpm --filter @gym/api db:generate &&
      pnpm build:domain &&
      pnpm --filter @gym/api build &&
      pnpm --filter @gym/api exec prisma migrate deploy &&
      pnpm --filter @gym/api db:seed
    startCommand: pnpm --filter @gym/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Solo el catálogo de ejercicios, sin el usuario demo.
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Connection string de Neon (la directa, sin pooler). Se carga a mano en Render.
      - key: DATABASE_URL
        sync: false
      # Mails de verificación por la API de Brevo (Render gratis bloquea SMTP). Se cargan a mano.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
