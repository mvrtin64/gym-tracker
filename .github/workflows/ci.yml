name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_tracker
      JWT_SECRET: secreto-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El cliente de Prisma no se versiona y el dominio se consume compilado.
      - run: pnpm --filter @gym/api db:generate
      - run: pnpm build:domain
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tests de integración de la API
        run: pnpm --filter @gym/api test:e2e
